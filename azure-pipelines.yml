trigger: none
pr: none

pool:
  name: Default

variables:
  - group: iac-secrets
  - name: serviceConnection
    value: azure-iac

stages:
  - stage: Plan
    jobs:
      - job: plan
        steps:
          - checkout: self

          - script: terraform fmt -check -recursive
            displayName: Check formatting

          - task: AzureCLI@2
            displayName: Init, validate and plan
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail
                export ARM_CLIENT_ID=$servicePrincipalId ARM_TENANT_ID=$tenantId
                export ARM_OIDC_TOKEN=$idToken ARM_USE_OIDC=true
                export ARM_SUBSCRIPTION_ID=$(az account show --query id --output tsv)
                terraform init -input=false
                terraform validate
                terraform plan -input=false -lock-timeout=2m
            env:
              TF_VAR_my_ip: $(my-ip)
              TF_VAR_ssh_public_key: $(ssh-public-key)

  - stage: Apply
    dependsOn: Plan
    jobs:
      - deployment: apply
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: Plan and apply
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -euo pipefail
                      export ARM_CLIENT_ID=$servicePrincipalId ARM_TENANT_ID=$tenantId
                      export ARM_OIDC_TOKEN=$idToken ARM_USE_OIDC=true
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id --output tsv)
                      terraform init -input=false
                      terraform plan -input=false -lock-timeout=2m -out=tfplan
                      terraform apply -input=false tfplan
                  env:
                    TF_VAR_my_ip: $(my-ip)
                    TF_VAR_ssh_public_key: $(ssh-public-key)
