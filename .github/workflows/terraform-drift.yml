name: Drift check

on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

env:
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_my_ip: ${{ secrets.MY_IP }}
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

jobs:
  drift:
    runs-on: ubuntu-latest
    environment: drift
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false

      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -detailed-exitcode -lock=false -no-color > plan.txt
          code=$?
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          grep -E '^Plan:|No changes' plan.txt
          if [ "$code" -eq 1 ]; then cat plan.txt; exit 1; fi
          exit 0

      - name: Open an issue
        if: steps.plan.outputs.exitcode == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Drift found on $(date +%F)" \
            --body "The daily plan found changes made outside Terraform. Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
